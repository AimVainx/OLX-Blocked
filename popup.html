<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background-color: #002f34; /* Classic OLX Dark Blue */
      color: #ffffff;
    }

    h2 {
      margin: 0 0 16px 0;
      font-size: 18px;
      text-align: center;
      color: #23e51b; /* Classic OLX Accent Green */
      border-bottom: 2px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 8px;
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      background: rgba(255, 255, 255, 0.08);
      padding: 10px 12px;
      border-radius: 6px;
    }

    .toggle-label {
      font-size: 13px;
      font-weight: bold;
    }

    /* Switch Styling */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: .3s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #23e51b; /* Green when Active */
    }

    input:checked + .slider:before {
      transform: translateX(20px);
    }

    .note {
      font-size: 11px;
      color: #b0c4de;
      text-align: center;
      margin-top: 10px;
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <h2>OLX Clean Control</h2>

  <div class="toggle-row">
    <span class="toggle-label">Featured Ads</span>
    <label class="switch">
      <input type="checkbox" id="toggleFeatured" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="toggle-row">
    <span class="toggle-label">Delivery Ads</span>
    <label class="switch">
      <input type="checkbox" id="toggleDelivery">
      <span class="slider"></span>
    </label>
  </div>

  <div class="note">
    * Market/Banner ads are permanently hidden.<br>
    * At least one toggle must remain ON.
  </div>

  <script src="popup.js"></script>
</body>
</html>
